name: Test Action

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Action with minimal inputs
        id: test-minimal
        uses: ./
        with:
          prompt-text: "This is a test of the Devin action"
          devin-token: "test-token-placeholder"
          org-id: "org-test-placeholder"
          dry-run: "true"

      - name: Test Action fails fast with unsupported API version
        id: test-unsupported-version
        uses: ./
        with:
          prompt-text: "This should fail before calling the Devin API"
          devin-token: "test-token-placeholder"
          org-id: "org-test-placeholder"
          api-version: "v1"
          dry-run: "true"
        continue-on-error: true

      - name: Test Action applies session parameters
        id: test-session-params
        uses: ./
        with:
          prompt-text: "This is a test of session parameters"
          session-params: "dry_run=true, unknown_param=1"
          devin-token: "test-token-placeholder"
          org-id: "org-test-placeholder"
          dry-run: "true"

      - name: Check session parameter prompt
        env:
          PROMPT: ${{ steps.test-session-params.outputs.prompt_readable }}
        run: |
          printf '%s\n' "$PROMPT" | head -1 | grep -qx 'SESSION PARAMETER dry_run=true:'
          ! printf '%s\n' "$PROMPT" | grep -q 'unknown_param'

      - name: Check test results
        run: |
          echo "Minimal dry-run outcome: ${{ steps.test-minimal.outcome }}"
          echo "Unsupported version outcome: ${{ steps.test-unsupported-version.outcome }}"
          test "${{ steps.test-minimal.outcome }}" = "success"
          test "${{ steps.test-unsupported-version.outcome }}" = "failure"
